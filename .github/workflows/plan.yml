name: Terraform Plan

on:
  pull_request:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Log in to AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::375243950139:role/github-actions-terraform
          aws-region: eu-central-1

      - name: Check formatting
        run: terraform fmt -check

      - name: Initialize
        run: terraform init

      - name: Validate
        run: terraform validate

      - name: Plan
        run: terraform plan